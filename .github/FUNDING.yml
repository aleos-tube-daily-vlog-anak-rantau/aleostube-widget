# 🧡 Aleo’s Tube Store — Pro Minimalist Business Edition

**Aleo’s Tube Store** adalah template Blogger profesional dengan gaya minimalis, elegan, dan modern — dirancang khusus untuk bisnis, branding, dan konten kreatif digital.  
Dibangun dengan kombinasi warna **oranye 🔶 & hitam ⚫**, memberikan kesan **enerjik, berani, dan khas Aleo.**

---

## 🌐 Fitur Utama

- ⚡ **Desain Minimalis & Profesional**
- 🧩 **Responsif di Semua Perangkat**
- 🌍 **Auto Translate (Google Translate Integration)**
- 📊 **Dual Google Analytics Integration (G-71BR09BJ1R & G-2F6SD6VRNM)**
- 🛍️ **Struktur Siap Branding Bisnis / Store**
- 🧠 **SEO-Friendly & Fast Loading**
- 🖼️ **Placeholder Logo & Banner Siap Ganti**
- 🔒 **Footer Copyright © 2025 Aleo’s Tube Store**

---

## 🧰 Struktur Template

Aleo’s_Tube_Store_Template.xml
├── <head> → Meta SEO, Analytics, Translate
├── <header> → Logo + Judul Utama
├── <nav> → Menu Navigasi
├── <div class="post"> → Area Konten / Artikel
└── <footer> → Hak Cipta & Informasi Situs

---

## 🧾 Cara Instalasi di Blogger

1. Masuk ke **Dashboard Blogger → Tema → Edit HTML**
2. Hapus semua kode lama.
3. Tempelkan seluruh isi file `Aleo’s_Tube_Store_Template.xml`
4. Simpan & lihat hasilnya 🎉

---

## 🔄 Sinkronisasi dengan GitHub

Jika kamu ingin menghubungkan template langsung dari GitHub (agar bisa update otomatis):

1. Upload file `Aleo’s_Tube_Store_Template.xml` ke repositori kamu  
   (misalnya di: `https://github.com/aleos-tube/Aleo’s-Tube-Store-Template`)
2. Klik file tersebut → **View Raw**
3. Salin URL Raw-nya (contoh):
4. Gunakan URL ini untuk sinkronisasi otomatis di Blogger editor.

